pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven {
            url = uri('https://ldtteam.jfrog.io/artifactory/tableau/')
            name = 'Tableau'
        }
    }

    // Fork: upstream builds against a local ../Tableau checkout; the published 0.0.107 plugin is used instead.
}

plugins {
    id 'com.ldtteam.tableau.all' version '0.0.107'
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'domum-ornamentum'

features {
    usesGit = true
    usesCurse = true
}


